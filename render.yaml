# render.yaml (Repository Root)
# Render Blueprint Specification for ALM Backend Web Service
services:
  - type: web
    name: alm-backend-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # Set securely in Render Dashboard
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a cryptographically secure random string
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        sync: false # Set to your deployed Vercel frontend URL
